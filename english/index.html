<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light" data-cloze="off">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2027 HKDSE 英國語文科複習寶典 | Paper 2 格式・5** 範文・套話 · Paper 3A 聆聽題型 · Paper 4 口試話術</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- Sticky Top Header -->
  <header class="topbar" id="topbar">
    <div class="topbar-inner">
      <div class="topbar-left">
        <button class="icon-btn mobile-menu-btn" id="mobileMenuBtn" aria-label="開啟目錄選單" title="目錄選單">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <a href="../index.html" class="icon-btn back-hub-btn" title="返回 2027 DSE 全科複習總控台">← 總覽</a>
        <a href="#overview" class="brand" id="brandLink">
          <span class="brand-badge">DSE 2027</span>
          <span class="brand-text">
            <span class="brand-title">HKDSE 英文科奪星寶典</span>
            <span class="brand-sub">Paper 2 格式・範文・套話 · Paper 3A 聆聽題型 · Paper 4 口試話術</span>
          </span>
        </a>
      </div>

      <!-- Global Instant Search -->
      <div class="search-wrap" id="searchWrap">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="search" id="globalSearch" class="search-input" autocomplete="off" placeholder="搜尋文體格式、5** 範文、套話、3A 題型、串字或口試連接詞（如：Editor、Proposal、倒裝、Sceptical、Having said that）..." />
        <kbd class="search-kbd">/</kbd>
        <div class="search-results" id="searchResults" hidden></div>
      </div>

      <!-- Header Controls -->
      <div class="topbar-right">
        <div class="mode-switch" role="group" aria-label="套話與話術背誦模式">
          <button class="mode-btn active" data-set-cloze="off" title="完整顯示所有英文例句與搭配">精讀模式</button>
          <button class="mode-btn" data-set-cloze="on" title="遮蓋高分關鍵詞，點擊逐項揭曉自測">背誦遮蓋</button>
        </div>
        <button class="icon-btn" id="themeToggle" aria-label="切換深淺色模式" title="切換深色／淺色護眼模式">
          <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <button class="icon-btn print-btn" id="printBtn" aria-label="列印當前筆記" title="列印當前溫習筆記">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
        </button>
      </div>
    </div>

    <!-- Primary Section Tabs -->
    <nav class="section-tabs" id="sectionTabs" aria-label="英文科主要複習單元">
      <div class="section-tabs-inner">
        <button class="tab-btn active" data-view="overview" id="tab-overview">
          <span class="tab-dot dot-amber"></span>
          <span>考評總覽與配速</span>
        </button>
        <button class="tab-btn" data-view="p2formats" id="tab-p2formats">
          <span class="tab-dot dot-navy"></span>
          <span>Paper 2 文章格式合集</span>
        </button>
        <button class="tab-btn" data-view="p2essays" id="tab-p2essays">
          <span class="tab-dot dot-crimson"></span>
          <span>Paper 2 高分 5** 範文</span>
        </button>
        <button class="tab-btn" data-view="p2phrases" id="tab-p2phrases">
          <span class="tab-dot dot-emerald"></span>
          <span>Paper 2 套話與句式升呢</span>
        </button>
        <button class="tab-btn" data-view="p3a" id="tab-p3a">
          <span class="tab-dot dot-violet"></span>
          <span>Paper 3A 聆聽題型示例</span>
        </button>
        <button class="tab-btn" data-view="p4" id="tab-p4">
          <span class="tab-dot dot-teal"></span>
          <span>Paper 4 口試話術與連接詞</span>
        </button>
        <button class="tab-btn" data-view="practice" id="tab-practice">
          <span class="tab-dot dot-slate"></span>
          <span>互動自測與收藏室</span>
        </button>
      </div>
    </nav>
  </header>

  <!-- Main Workspace Layout -->
  <div class="app-shell">
    <!-- Left Context Sidebar -->
    <aside class="sidebar" id="sidebar" aria-label="章節導航">
      <div class="sidebar-header">
        <div class="progress-widget">
          <div class="progress-row">
            <span class="progress-label">英文核心單元掌握進度</span>
            <span class="progress-pct" id="masteryPct">0%</span>
          </div>
          <div class="progress-track">
            <div class="progress-fill" id="masteryFill" style="width: 0%"></div>
          </div>
          <div class="progress-meta">
            <span id="masteryCount">已掌握 0 / 31 項</span>
            <button class="text-link-btn" id="openBookmarksBtn">★ 重點收藏 (0)</button>
          </div>
        </div>
      </div>
      <div class="sidebar-nav" id="sidebarNav"></div>
    </aside>

    <!-- Mobile Backdrop -->
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <!-- Main Dynamic View -->
    <main class="main-content" id="mainContent"></main>
  </div>

  <!-- Toast Notification -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- Back to top -->
  <button class="back-to-top" id="backToTop" aria-label="回到頂部" title="回到頂部">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="18 15 12 9 6 15"/></svg>
  </button>

  <!-- Global Data Registries (100% offline file:// compatible) -->
  <script>
    window.ENG_META = {};
    window.ENG_P2_FORMATS = {};
    window.ENG_P2_ESSAYS = [];
    window.ENG_P2_PHRASES = {};
    window.ENG_P3A = {};
    window.ENG_P4 = {};
    window.ENG_QUIZZES = [];
  </script>

  <!-- Data Modules -->
  <script src="data/meta.js"></script>
  <script src="data/p2_formats.js"></script>
  <script src="data/p2_essays.js"></script>
  <script src="data/p2_phrases.js"></script>
  <script src="data/p3a_listening.js"></script>
  <script src="data/p4_speaking.js"></script>
  <script src="data/quizzes.js"></script>

  <!-- Interactive App & Practice Controllers -->
  <script src="js/practice.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
