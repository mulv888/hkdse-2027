<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light" data-lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2027 HKDSE ICT 複習全攻略 | Paper 1 · Elective A · Elective C (Python)</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- Top Sticky Header -->
  <header class="topbar" id="topbar">
    <div class="topbar-inner">
      <div class="topbar-left">
        <button class="icon-btn mobile-menu-btn" id="mobileMenuBtn" aria-label="Toggle navigation menu" title="Menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <a href="../index.html" class="icon-btn" style="width:auto;padding:0 10px;font-size:0.78rem;font-weight:700;gap:4px;text-decoration:none;" title="返回 2027 DSE 科目總覽 / Back to Hub">← 總覽</a>
        <a href="#overview" class="brand" id="brandLink">
          <span class="brand-badge">DSE 2027</span>
          <span class="brand-text">
            <span class="brand-title" data-i18n="siteTitle">HKDSE ICT 複習寶典</span>
            <span class="brand-sub" data-i18n="siteSub">Paper 1 · 選修 A 數據庫 · 選修 C Python</span>
          </span>
        </a>
      </div>

      <!-- Search Box -->
      <div class="search-wrap" id="searchWrap">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="search" id="globalSearch" class="search-input" autocomplete="off" placeholder="搜尋知識點 / Search topics (e.g. 3NF, JOIN, Python, 補碼)..." />
        <kbd class="search-kbd">/</kbd>
        <div class="search-results" id="searchResults" hidden></div>
      </div>

      <!-- Controls -->
      <div class="topbar-right">
        <!-- Bilingual Switcher -->
        <div class="lang-switch" role="group" aria-label="Language mode">
          <button class="lang-btn active" data-set-lang="zh" title="繁體中文 (按 L 切換)">繁中</button>
          <button class="lang-btn" data-set-lang="both" title="中英對照 (按 L 切換)">中英對照</button>
          <button class="lang-btn" data-set-lang="en" title="English (Press L to switch)">ENG</button>
        </div>
        <!-- Theme Toggle -->
        <button class="icon-btn" id="themeToggle" aria-label="Toggle dark mode" title="切換深色/淺色模式">
          <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <!-- Print Button -->
        <button class="icon-btn print-btn" id="printBtn" aria-label="Print current notes" title="列印當前筆記 / Print Notes">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
        </button>
      </div>
    </div>

    <!-- Primary Section Tabs -->
    <nav class="section-tabs" id="sectionTabs" aria-label="Primary sections">
      <div class="section-tabs-inner">
        <button class="tab-btn active" data-view="overview" id="tab-overview">
          <span class="tab-dot dot-slate"></span>
          <span data-i18n="navOverview">考試總覽</span>
        </button>
        <button class="tab-btn" data-view="paper1" id="tab-paper1">
          <span class="tab-dot dot-p1"></span>
          <span data-i18n="navPaper1">卷一 必修 (A–E)</span>
        </button>
        <button class="tab-btn" data-view="electiveA" id="tab-electiveA">
          <span class="tab-dot dot-ea"></span>
          <span data-i18n="navElectiveA">卷二 選修 A 數據庫</span>
        </button>
        <button class="tab-btn" data-view="electiveC" id="tab-electiveC">
          <span class="tab-dot dot-ec"></span>
          <span data-i18n="navElectiveC">卷二 選修 C 算法與 Python</span>
        </button>
        <button class="tab-btn" data-view="labs" id="tab-labs">
          <span class="tab-dot dot-lab"></span>
          <span data-i18n="navLabs">互動實驗室</span>
        </button>
        <button class="tab-btn" data-view="quiz" id="tab-quiz">
          <span class="tab-dot dot-quiz"></span>
          <span data-i18n="navQuiz">模擬測驗</span>
        </button>
        <button class="tab-btn" data-view="cheatsheets" id="tab-cheatsheets">
          <span class="tab-dot dot-cheat"></span>
          <span data-i18n="navCheat">考前速查表</span>
        </button>
      </div>
    </nav>
  </header>

  <!-- Main Workspace Layout -->
  <div class="app-shell">
    <!-- Left Sidebar -->
    <aside class="sidebar" id="sidebar" aria-label="Syllabus navigation">
      <div class="sidebar-header">
        <div class="progress-widget">
          <div class="progress-row">
            <span class="progress-label" data-i18n="masteryProgress">溫習掌握進度</span>
            <span class="progress-pct" id="masteryPct">0%</span>
          </div>
          <div class="progress-track">
            <div class="progress-fill" id="masteryFill" style="width: 0%"></div>
          </div>
          <div class="progress-meta">
            <span id="masteryCount">0 / 0</span>
            <button class="text-link-btn" id="filterBookmarksBtn" data-i18n="viewBookmarks">★ 查看收藏 (0)</button>
          </div>
        </div>
      </div>
      <div class="sidebar-nav" id="sidebarNav"></div>
    </aside>

    <!-- Backdrop for mobile drawer -->
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <!-- Main Content Area -->
    <main class="main-content" id="mainContent">
      <!-- Dynamically rendered view -->
    </main>
  </div>

  <!-- Back to top button -->
  <button class="back-to-top" id="backToTop" aria-label="Back to top" title="回到頂部">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="18 15 12 9 6 15"/></svg>
  </button>

  <!-- Initialize Global Registries -->
  <script>
    window.ICT_META = {};
    window.ICT_MODULES = [];
    window.ICT_QUIZZES = [];
  </script>

  <!-- Data Modules (loaded as regular scripts so file:// double-click works seamlessly without CORS) -->
  <script src="data/meta.js"></script>
  <script src="data/paper1_a.js"></script>
  <script src="data/paper1_b.js"></script>
  <script src="data/paper1_c.js"></script>
  <script src="data/paper1_d.js"></script>
  <script src="data/paper1_e.js"></script>
  <script src="data/elective_a.js"></script>
  <script src="data/elective_c.js"></script>
  <script src="data/quizzes.js"></script>

  <!-- Interactive App Scripts -->
  <script src="js/labs.js"></script>
  <script src="js/quiz.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
