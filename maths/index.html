          <span class="brand-badge">DSE 2027</span>

            <span class="brand-sub" data-i18n="siteSub">Paper 2 MC 秒殺技巧 · Paper 1 壓軸難題 · 12 大 Topic 分類</span>
          </span>

      <!-- Global Search -->
      <div class="search-wrap" id="searchWrap">

        <div class="search-results" id="searchResults" hidden></div>

        <div class="lang-switch" role="group" aria-label="語言切換">

      <div class="section-tabs-inner">
        <button class="tab-btn active" data-view="overview" id="tab-overview">
          <span class="tab-dot dot-teal"></span>
          <span>考試總覽與計數機攻略</span>
        </button>
        <button class="tab-btn" data-view="p2skills" id="tab-p2skills">

        <button class="tab-btn" data-view="p2drill" id="tab-p2drill">
          <span class="tab-dot dot-indigo"></span>

        <button class="tab-btn" data-view="formulas" id="tab-formulas">
          <span class="tab-dot dot-emerald"></span>
          <span>5** 核心公式與必背性質</span>

        <button class="tab-btn" data-view="bookmarks" id="tab-bookmarks">
          <span class="tab-dot dot-violet"></span>
          <span>錯題本與重點收藏</span>

    <aside class="sidebar" id="sidebar" aria-label="課題導航">
      <div class="sidebar-header">
        <div class="progress-widget">

            <span class="progress-pct" id="masteryPct">0%</span>
          </div>
          <div class="progress-track">
            <div class="progress-fill" id="masteryFill" style="width: 0%"></div>

          <div class="progress-meta">

            <button class="text-link-btn" id="openBookmarksBtn">★ 錯題收藏 (0)</button>
          </div>
        </div>
      </div>
      <div class="sidebar-nav" id="sidebarNav"></div>
    </aside>

    <!-- Mobile Backdrop -->

  <!-- Syllabus & Question Data Modules -->

  <script src="data/p1_hard_geometry.js"></script>
